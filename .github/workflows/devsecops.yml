name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests + coverage (gate >= 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (laporan JSON)
        run: bandit -r app run.py -f json -o bandit-report.json || true

      - name: Tampilkan ringkasan Bandit
        run: bandit -r app run.py || true

      - name: Upload laporan SAST
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download laporan SAST
        uses: actions/download-artifact@v4
        with:
          name: bandit-report

      - name: Evaluasi Quality Gate
        run: python scripts/quality_gate.py bandit-report.json
